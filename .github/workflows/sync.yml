# ===========================================================================
# Weekly VM Analytics sync (Vita Mojo -> Supabase)
#
# ---------------------------------------------------------------------------
# THERE IS NO `schedule:` BLOCK, ON PURPOSE
# ---------------------------------------------------------------------------
# This workflow used to carry `- cron: '30 1 * * 1'` (Monday 01:30 UTC =
# 07:00 IST). GitHub's own `schedule:` cron is best-effort and is queued behind
# whatever else the hosted runners are doing — the 2026-08-31 run started more
# than five hours late. :30-past slots are among the worst affected.
#
# cron-job.org now drives this at 01:30 UTC every Monday by POSTing straight to
# the GitHub REST API, exactly as it already does for daily-net-sales.yml:
#
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/
#        sync.yml/dispatches                 body: {"ref":"main"}
#        header: Authorization: Bearer <fine-grained PAT, Actions: RW>
#
# A dispatch is an API call rather than a queued event, so it fires promptly.
# It also sidesteps GitHub auto-disabling scheduled workflows after 60 days of
# repo inactivity.
#
# TIMING — the daily net-sales run must never overlap this one. It fires at
# 00:30 Europe/London and is hard-killed at 00:50 by its `timeout-minutes: 20`.
# Now that this run actually starts at 01:30 UTC instead of drifting later, the
# gap is 40 minutes in GMT (100 in BST) and is no longer accidental. Keep this
# job on the **UTC** timezone in cron-job.org, and do not raise the daily's
# timeout without moving this schedule too.
#
# The 204 that cron-job.org sees means "the run was QUEUED", not "the sync
# succeeded" — this workflow has no failure-alert step, so check the Actions
# tab (or add one, mirroring daily-net-sales.yml).
#
# See docs/deploying-the-daily-feed.md section 8, job 4.
# ===========================================================================

name: Weekly VM Hub → Supabase Sync

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Override START_DATE (YYYY-MM-DD, optional)'
        required: false
      end_date:
        description: 'Override END_DATE (YYYY-MM-DD, optional)'
        required: false
      weeks_back:
        description: 'Weeks to sync (default 1 = last complete Mon–Sun week)'
        required: false
        default: '1'

# Never cancel a running sync — queue a new one instead.
concurrency:
  group: vm-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Vita Mojo → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VM_HUB_URL: https://hub.vitamojo.com
      VM_HUB_EMAIL: ${{ secrets.VM_HUB_EMAIL }}
      VM_HUB_PASSWORD: ${{ secrets.VM_HUB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STORES: 'Peckers Hitchin,Peckers Stevenage'
      HEADLESS: '1'
      DEBUG_SHOTS: '1'
      WEEKS_BACK: ${{ github.event.inputs.weeks_back || '1' }}
      START_DATE: ${{ github.event.inputs.start_date || '' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Restore saved VM Hub session (optional)
        # VM_AUTH_JSON holds the output of `context.storageState()` saved after
        # running `npm run auth` locally. Restoring it lets auto-auth skip the
        # password flow when the session is still valid (faster, more reliable).
        # If the secret is absent or the session has expired, auto-auth falls
        # back to email+password login automatically.
        run: |
          if [ -n "${{ secrets.VM_AUTH_JSON }}" ]; then
            printf '%s' "${{ secrets.VM_AUTH_JSON }}" > auth.json
            echo "[setup] Restored auth.json from VM_AUTH_JSON secret."
          else
            echo "[setup] VM_AUTH_JSON not set — auto-auth will log in fresh."
          fi

      - name: Authenticate with VM Hub
        # Tries the restored session; falls back to email+password if expired.
        # Saves a refreshed auth.json on success (used immediately by sync).
        run: node src/auto-auth.js

      - name: Run sync (previous complete week)
        run: npm run sync

      - name: Upload debug artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-sync-debug-${{ github.run_id }}
          path: |
            debug/
            downloads/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Sync completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Sync failed — check logs above" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Completed at | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| WEEKS_BACK | ${WEEKS_BACK} |" >> $GITHUB_STEP_SUMMARY
          echo "| START_DATE override | ${START_DATE:-none} |" >> $GITHUB_STEP_SUMMARY
          echo "| END_DATE override | ${END_DATE:-none} |" >> $GITHUB_STEP_SUMMARY
          echo "| Stores | ${STORES} |" >> $GITHUB_STEP_SUMMARY
